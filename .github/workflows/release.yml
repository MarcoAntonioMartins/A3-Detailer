name: Testes e versão

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 2.7 = Ruby do SketchUp 2021-2023; 3.2 = SketchUp 2024+
        ruby: ['2.7', '3.2']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Rodar testes
        run: ruby test/executar_todos.rb

  publicar:
    needs: testes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Empacotar .rbz
        run: ruby tools/build.rb
      - name: Criar release com o .rbz
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rbz
          generate_release_notes: true
